configuration:
  auth_method:
    name: Authentication method
    description: >-
      "oauth" (recommended) uses a Claude subscription: run `claude setup-token`
      on any computer signed in to your Claude Pro, Max, Team or Enterprise
      account and paste the token below. "api_key" uses a static Anthropic API
      key billed to your API account.
  oauth_token:
    name: Subscription OAuth token
    description: >-
      Token from `claude setup-token`. It opens a browser login against your
      Claude subscription and prints a long-lived token (valid about a year).
      Only used when the authentication method is "oauth".
  anthropic_api_key:
    name: Anthropic API key (legacy)
    description: >-
      Only used when the authentication method is "api_key". API key from the
      Claude Console. Usage is billed to your Anthropic account. Leave empty if
      you route requests through a gateway that does its own authentication.
  anthropic_base_url:
    name: API base URL
    description: >-
      Optional. Send requests to a custom Anthropic-compatible endpoint or
      gateway instead of api.anthropic.com.
  log_level:
    name: Log level
    description: Verbosity of the add-on log.
  auto_approve_readonly_tools:
    name: Auto-approve read-only Home Assistant tools
    description: >-
      When enabled, tools that only read from Home Assistant (states, services,
      areas, logs, templates) run without a permission prompt. Writes always
      follow the permission mode selected in the chat.
